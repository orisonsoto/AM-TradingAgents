  - id: ADR-PROPOSED-backend-layout
    title: "Layout canónico del backend y de la persistencia"
    context: "Coexisten apps/api (docs, stories.yaml, component-ownership) y app/ (código generado en #23-#25); alembic/ vs migrations/; tres DeclarativeBase; dos modelos TradingRun para la misma tabla."
