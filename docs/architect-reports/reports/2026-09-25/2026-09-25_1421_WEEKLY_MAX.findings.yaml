    consequences: "pr_creator y dev-loop apuntan a desarrollo-agentico; PR #1 se divide (docs primero) o se cierra al converger."
  - id: ADR-PROPOSED-single-frontend
    title: "Un solo frontend: apps/web"
    context: "frontend/ (25 archivos, TSX con errores de sintaxis), src/ (9) y apps/web (dashboard estático) conviven sin package.json."
