    recommendation: "A. El SoR ya lo especifica y allowed_modules lo hace cumplir; B obliga a reescribir 4 documentos y perpetúa un layout que nació por accidente."
    consequences: "Cerrar #23-#25; el primer PR real de infraestructura crea tradingagents/db/base.py (Base único) y migrations/env.py; todo modelo nuevo hereda de ese Base y trae su migración."
  - id: ADR-PROPOSED-integration-branch-and-upstream
    title: "desarrollo-agentico como rama de integración; main como espejo de upstream"
    context: "Los PRs de story apuntan a main (pr_creator.py:136); dev-loop.md vuelve a main; CLAUDE.md declara desarrollo-agentico activo; PR #1 (95 archivos) sigue abierto."
    options: ["A: base de PRs = desarrollo-agentico; main solo recibe merges de upstream y releases", "B: fusionar PR #1 en main y trabajar sobre main"]
