findings:
  # ---------------------------------------------------------------- S1 ----
  - id: VALIDATOR-unicode-exit-on-windows
    title: "validate_story.py termina con UnicodeEncodeError en Windows aunque todos los checks pasen"
    area: validator
    severity: S1
    confidence: medium
    verification: executed
    evidence:
      - {kind: file, path: "scripts/validate_story.py", lines: "160", note: "print(\"\\n✓ All checks passed.\") — U+2713 no existe en cp1252"}
      - {kind: file, path: "scripts/autonomous_loop.py", lines: "26", note: "subprocess.run(capture_output=True, text=True) sin encoding → el hijo escribe a una tubería con la codificación de la consola de Windows"}
      - {kind: command, cmd: "PYTHONIOENCODING=cp1252 python -c 'print(\"\\n✓ All checks passed.\")'", output: "UnicodeEncodeError: 'charmap' codec can't encode character '\\u2713'", note: "simulación en Linux de la tubería cp1252 de Windows"}
    why_it_matters: >
      En la máquina del operador (Windows, sin PYTHONUTF8=1) el validador solo llega a la línea 160 cuando TODO pasó;
      ahí lanza un traceback y sale con código 1. El loop lo interpreta como fallo, entra en el fix-loop con un prompt
      que es el traceback (stderr), y tras 3 rondas marca BLOCKED_AUTOMATION. Explica bloqueos "inexplicables" sin
      culpar al modelo.
    root_cause: "Salida no ASCII en un script que se consume por tubería en Windows; ningún subprocess fija encoding='utf-8'."
    recommendation: >
      Sustituir "✓" por texto ASCII; en autonomous_loop.run() y pr_creator.run() usar subprocess.run(…, encoding="utf-8",
      errors="replace"); exportar PYTHONUTF8=1 en los scripts de arranque; test: ejecutar validate_story con
      PYTHONIOENCODING=cp1252 y exigir exit 0 en el camino verde.
    owner_suggestion: sonnet
    delegable_to_local_model: "no"
    requires_human_decision: false
    human_decision_question: null
    prerequisites: []
    work_order: null
    related: [LOOP-fix-loop-blind, DATA-stories-yaml-mojibake]
    effort: S
  - id: PR-agent0001-service-nameerror
    title: "TradingRunService no importa DomainEvent: el módulo lanza NameError al importarse"
    area: code
    severity: S1
    confidence: high
    verification: executed
    evidence:
      - {kind: file, path: "app/services/trading_run_service.py", lines: "9-18,123", note: "PR #25 a973ba7: la anotación `event: DomainEvent` se evalúa en tiempo de definición (no hay `from __future__ import annotations`) y DomainEvent no está importado"}
      - {kind: command, cmd: "pytest tests/unit -q -o addopts=\"\" (worktree #25, deps instaladas)", output: "ERROR tests/unit/test_run_lifecycle.py - NameError: name 'DomainEvent' is not defined; ERROR tests/unit/test_run_failure_handling.py", note: "los dos tests de AC-01/AC-03 de US-AGENT-0001 no se pueden ni colectar"}
    why_it_matters: "La story está marcada DONE y su servicio central no importa. Ningún test de la story ha pasado nunca."
    root_cause: "Qwen generó el archivo sin ejecutar imports; el validador nunca corrió estos tests (VALIDATOR-pytest-broken-env)."
    recommendation: "Añadir `from app.events.trading_run_events import DomainEvent` (o `from __future__ import annotations`). Solo si se decide rehacer US-AGENT-0001 sobre desarrollo-agentico."
    owner_suggestion: qwen
    delegable_to_local_model: partial
    requires_human_decision: true
    human_decision_question: "¿Se cierran los PRs #22-#25 y se rehacen las stories sobre desarrollo-agentico (recomendado) o se corrigen in situ?"
    prerequisites: [PROCESS-branching-and-fork-strategy]
    work_order: null
    related: [STORY-done-with-red-ci, TEST-pr-tests-missing-fixtures]
    effort: S
  - id: SEC-runs-endpoint-unauthenticated-tenant-hardcoded
    title: "Endpoints /runs sin autenticación, tenant fijo 'default-tenant' y GET sin filtro de tenant"
    area: security
    severity: S1
    confidence: high
    verification: executed
    evidence:
      - {kind: file, path: "app/api/v1/runs.py", lines: "22", note: "tenant_id: str = Depends(lambda: \"default-tenant\")"}
      - {kind: file, path: "app/api/v1/runs.py", lines: "47-59", note: "get_run(run_id) → service.get_run(run_id) sin tenant → cualquier tenant lee cualquier run (viola US-API-0001 AC-03)"}
      - {kind: file, path: "app/api/v1/runs.py", lines: "1-16", note: "no importa require_auth; get_db_session lanza NotImplementedError"}
      - {kind: file, path: "app/api/v1/router.py", lines: "7-10", note: "solo incluye health_router: el router de runs no está montado"}
      - {kind: command, cmd: "TestClient(create_app()).post('/api/v1/runs', json={...})", output: "404", note: "rutas registradas: /docs, /openapi.json, /redoc, /health"}
    why_it_matters: >
      Es el primer código de la plataforma que toca datos por tenant y fija el patrón que el modelo local repetirá:
      sin auth, tenant hardcodeado y consultas sin filtro. Hoy no es explotable porque el router no está montado, pero
      la story figura DONE.
    root_cause: "Prompt de implementación sin contrato de seguridad (story-contract security_requirements no llega al modelo); ausencia de reviewer."
    recommendation: >
      Al rehacer US-AGENT-0001/US-API-0001: dependencia get_current_tenant() desde el JWT, `where(TradingRun.tenant_id
      == tenant)` en todas las consultas, 404 para run de otro tenant, montar el router en api_v1_router y test
      test_run_tenant_isolation con dos tenants.
    owner_suggestion: sonnet
    delegable_to_local_model: partial
    requires_human_decision: false
    human_decision_question: null
    prerequisites: [SEC-jwt-secret-not-configurable, PROCESS-branching-and-fork-strategy]
    work_order: null
    related: [H-tenant-isolation-design, DOMAIN-live-mode-accepted-by-api-schema]
    effort: M
