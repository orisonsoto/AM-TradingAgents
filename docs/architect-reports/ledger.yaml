# Ledger de hallazgos del Arquitecto y Auditor Independiente.
# Estado vivo de cada hallazgo. Lo escribe SOLO el orquestador (Claude Code / Sonnet).
# El auditor (Fable) no lo edita: emite veredictos en reports/<fecha>/<run_id>.findings.yaml (bloque `recheck`).
#
# Estados:
#   open                  registrado, sin triage
#   triaged               reproducido por el orquestador; severidad y owner confirmados
#   in_progress           work order / story de fix en curso
#   fixed_pending_verify  fix mergeado; espera veredicto `resolved_verified` de la próxima corrida
#   resolved              verificado por el auditor con evidencia
#   rejected              falso positivo o no aplica; el motivo va en `notes` (obligatorio)
#   superseded            absorbido por otro hallazgo; `superseded_by` obligatorio
#
# Campos: id, title, severity (S0..S4 | H), area, status, source (informe/corrida que lo introdujo),
#         last_recheck (run_id del último veredicto del auditor, o null), owner (qwen|sonnet|human|fable|ci|null), notes.
